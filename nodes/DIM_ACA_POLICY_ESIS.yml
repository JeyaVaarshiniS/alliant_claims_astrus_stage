name: DIM_ACA_POLICY_ESIS
operation:
  config:
    insertStrategy: INSERT
    postSQL: |-
      BEGIN
          USE DATABASE ALLIANT_CLAIMS_ASTRUS;
          UPDATE ALLIANT_CLAIMS_ASTRUS.DBO.DIM_ACA_POLICY_ESIS AS T
          SET 
              T.ACA_DATE_ID_EXPIRATION_DATE = CAST(TRY_TO_CHAR(S.EXPIRATION_DATE, 'YYYYMMDD') AS INT),
              T.EXPIRATION_DATE = S.EXPIRATION_DATE,
              T.ACA_DATE_UPDATED = CURRENT_TIMESTAMP(),
              T.ACA_UPDATE_USER = '{{- target.name -}}'
          FROM {{ ref('DBSHIFT', 'ACA_POLICY_STAGING_ESIS') }} AS S
          WHERE S.SOURCE_SYSTEM_POLICY_ID = T.SOURCE_SYSTEM_POLICY_ID
            AND S.ACA_SOURCE_SYSTEM_ID = T.ACA_SOURCE_SYSTEM_ID
            AND T.ACA_DATE_CREATED <> CURRENT_TIMESTAMP()
            AND IFNULL(T.EXPIRATION_DATE, CAST('1776-07-04' AS DATE)) <> IFNULL(S.EXPIRATION_DATE, CAST('1776-07-04' AS DATE));
      END;
    preSQL: ""
    testsEnabled: true
    truncateBefore: false
